    const playAlertChime = (severity = 'moderate') => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (severity === 'critical') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(440, now + 0.35);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now); // D5
          osc.frequency.exponentialRampToValueAtTime(880, now + 0.25); // A5
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }

    function App() {
      // Primary States
      const [alerts, setAlerts] = useState(INITIAL_ALERTS);
      const [rescueTeams, setRescueTeams] = useState(INITIAL_RESCUE_TEAMS);
      const [shelters, setShelters] = useState(INITIAL_SHELTERS);
      const [supplies, setSupplies] = useState(INITIAL_SUPPLIES);
      
      const [currentView, setCurrentView] = useState("dashboard"); // dashboard, analytics, map, liveFeed, resources
      const [selectedRegion, setSelectedRegion] = useState("all");
      const [selectedDay, setSelectedDay] = useState("Sat");
      const [searchQuery, setSearchQuery] = useState("");
      const [isDarkMode, setIsDarkMode] = useState(false);
      const [isSimulating, setIsSimulating] = useState(true);
      const [simSpeed, setSimSpeed] = useState(1);
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [showProjectModal, setShowProjectModal] = useState(false);
      const [showNotificationTray, setShowNotificationTray] = useState(false);
      const [bannerDismissed, setBannerDismissed] = useState(false);
      const [liveSeconds, setLiveSeconds] = useState(0);
      
      // Interactive Chart States
      const [chartMetric, setChartMetric] = useState("Hourly"); // Hourly, Weekly, Pressure, Wind
      const [hoveredTrendPoint, setHoveredTrendPoint] = useState(CHART_DATASETS.Hourly.points[3]);
      const [precipitationMetric, setPrecipitationMetric] = useState("rain"); // rain, prob, runoff
      const [mapLayer, setMapLayer] = useState("temp"); // temp, radar, satellite
      const [inspectingAlert, setInspectingAlert] = useState(null);

      // Hero dynamic values based on selection
      const [activeHeroTemp, setActiveHeroTemp] = useState(27);
      const [activeHeroCondition, setActiveHeroCondition] = useState("Sunny Cloudy");

      // Auto update Lucide icons whenever DOM changes
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Synchronize dark mode class to document body
      useEffect(() => {
        if (isDarkMode) {
          document.body.classList.add('dark');
        } else {
          document.body.classList.remove('dark');
        }
      }, [isDarkMode]);

      // Clock and Simulation JavaScript Timer
      useEffect(() => {
        const clockInterval = setInterval(() => {
          setLiveSeconds(prev => prev + 1);
        }, 1000);
        return () => clearInterval(clockInterval);
      }, []);

      // Real-Time Event Feed Generator Timer (Pure Client-Side Timers)
      useEffect(() => {
        if (!isSimulating) return;

        const baseInterval = 12000 / simSpeed;
        const simTimer = setInterval(() => {
          const randomTemplate = SIMULATION_EVENT_POOL[Math.floor(Math.random() * SIMULATION_EVENT_POOL.length)];
          const newAlertId = "ALT-" + Date.now().toString().slice(-4);
          const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          
          const newAlert = {
            id: newAlertId,
            timestamp: `Today • ${nowStr} • ${randomTemplate.title}`,
            fullTime: `Today • ${nowStr}`,
            title: randomTemplate.title,
            category: randomTemplate.category,
            region: randomTemplate.region,
            regionKey: randomTemplate.regionKey,
            severity: randomTemplate.severity,
            temp: randomTemplate.temp,
            high: randomTemplate.high,
            low: randomTemplate.low,
            icon: randomTemplate.icon,
            windSpeed: randomTemplate.windSpeed,
            rainfall: randomTemplate.rainfall,
            pressure: randomTemplate.pressure || "996 hPa",
            description: randomTemplate.description,
            advisory: randomTemplate.advisory,
            isAcknowledged: false,
            active: true
          };

          setAlerts(prev => [newAlert, ...prev.slice(0, 9)]);
          setBannerDismissed(false);
          
          if (soundEnabled) {
            playAlertChime(randomTemplate.severity);
          }
        }, baseInterval);

        return () => clearInterval(simTimer);
      }, [isSimulating, simSpeed, soundEnabled]);

      // Trigger immediate test alert manually
      const triggerManualAlert = (severity = 'critical') => {
        const matches = SIMULATION_EVENT_POOL.filter(e => severity === 'all' || e.severity === severity);
        const item = matches.length > 0 ? matches[Math.floor(Math.random() * matches.length)] : SIMULATION_EVENT_POOL[0];
        const newAlertId = "ALT-" + Date.now().toString().slice(-4);
        const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const manualAlert = {
          id: newAlertId,
          timestamp: `Now • ${nowStr} • ${item.title}`,
          fullTime: `Now • ${nowStr}`,
          title: item.title,
          category: item.category,
          region: item.region,
          regionKey: item.regionKey,
          severity: item.severity,
          temp: item.temp,
          high: item.high,
          low: item.low,
          icon: item.icon,
          windSpeed: item.windSpeed,
          rainfall: item.rainfall,
          pressure: item.pressure || "992 hPa",
          description: item.description,
          advisory: item.advisory,
          isAcknowledged: false,
          active: true
        };

        setAlerts(prev => [manualAlert, ...prev.slice(0, 9)]);
        setBannerDismissed(false);
        if (soundEnabled) {
          playAlertChime(item.severity);
        }
      };

      // Highest active severity calculation
      const topCriticalAlert = useMemo(() => {
        return alerts.find(a => !a.isAcknowledged && a.severity === 'critical') || 
               alerts.find(a => a.severity === 'critical') || 
               alerts[0];
      }, [alerts]);

      // Filtered alerts based on search query and region
      const filteredAlerts = useMemo(() => {
        return alerts.filter(a => {
          const matchesQuery = searchQuery === "" || 
            a.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            a.region.toLowerCase().includes(searchQuery.toLowerCase()) ||
            a.severity.toLowerCase().includes(searchQuery.toLowerCase()) ||
            a.category.toLowerCase().includes(searchQuery.toLowerCase());
          
          const matchesRegion = selectedRegion === "all" || a.regionKey === selectedRegion;
          return matchesQuery && matchesRegion;
        });
      }, [alerts, searchQuery, selectedRegion]);

      // Acknowledge alert handler
      const handleAcknowledge = (id) => {
        setAlerts(prev => prev.map(a => a.id === id ? { ...a, isAcknowledged: true } : a));
      };

      // Deploy team action handler
      const handleDeployTeam = (teamId) => {
        setRescueTeams(prev => prev.map(t => {
          if (t.id === teamId) {
            return { ...t, status: t.status === "Deployed" ? "Standby" : "Deployed" };
          }
          return t;
        }));
        if (soundEnabled) playAlertChime('low');
      };

      // Forecast days data
      const forecastDays = [
        { day: "Mon", date: "27 May", icon: "cloud-sun", temp: "19°", num: 19, cond: "Sunny Cloudy", high: 22, low: 14 },
        { day: "Tue", date: "28 May", icon: "cloud-rain", temp: "17°", num: 17, cond: "Rain & Showers", high: 20, low: 13 },
        { day: "Wed", date: "29 May", icon: "cloud-lightning", temp: "20°", num: 20, cond: "Rain Lightning", high: 23, low: 16 },
        { day: "Thu", date: "30 May", icon: "sun", temp: "26°", num: 26, cond: "Clear Sunny", high: 28, low: 18 },
        { day: "Fri", date: "31 May", icon: "cloud-sun", temp: "28°", num: 28, cond: "Partly Cloudy", high: 30, low: 19 },
        { day: "Sat", date: "1 June", icon: "cloud-sun", temp: "27°", num: 27, cond: "Sunny Cloudy", high: 29, low: 15 },
        { day: "Sun", date: "2 June", icon: "cloud", temp: "24°", num: 24, cond: "Strong Winds", high: 25, low: 16 }
      ];

      // Handle selecting a forecast day
      const handleSelectDay = (f) => {
        setSelectedDay(f.day);
        setActiveHeroTemp(f.num);
        setActiveHeroCondition(f.cond);
      };

      // Precipitation bars data with mode switching
      const precipitationBars = useMemo(() => {
        if (precipitationMetric === "rain") {
          return [
            { day: "Mon", percent: 55, label: "18mm", sub: "Light Rain" },
            { day: "Tue", percent: 85, label: "38mm", sub: "Heavy Downpour" },
            { day: "Wed", percent: 35, label: "12mm", sub: "Drizzle" },
            { day: "Thu", percent: 68, label: "26mm", sub: "Moderate Rain" },
            { day: "Fri", percent: 45, label: "15mm", sub: "Passing Squall" },
            { day: "Sat", percent: 90, label: "45mm", sub: "Storm Inundation" },
            { day: "Sun", percent: 70, label: "28mm", sub: "Coastal Showers" }
          ];
        } else if (precipitationMetric === "prob") {
          return [
            { day: "Mon", percent: 40, label: "40%", sub: "Scattered" },
            { day: "Tue", percent: 95, label: "95%", sub: "Imminent" },
            { day: "Wed", percent: 30, label: "30%", sub: "Isolated" },
            { day: "Thu", percent: 75, label: "75%", sub: "Likely" },
            { day: "Fri", percent: 50, label: "50%", sub: "Moderate" },
            { day: "Sat", percent: 99, label: "99%", sub: "Severe" },
            { day: "Sun", percent: 65, label: "65%", sub: "Frequent" }
          ];
        } else {
          return [
            { day: "Mon", percent: 30, label: "Low", sub: "Nominal" },
            { day: "Tue", percent: 78, label: "High", sub: "River Surge" },
            { day: "Wed", percent: 20, label: "Low", sub: "Normal" },
            { day: "Thu", percent: 60, label: "Med", sub: "Urban Catchment" },
            { day: "Fri", percent: 40, label: "Med", sub: "Sustained" },
            { day: "Sat", percent: 92, label: "CRITICAL", sub: "Flash Basin Breach" },
            { day: "Sun", percent: 68, label: "High", sub: "Elevated" }
          ];
        }
      }, [precipitationMetric]);

      // Active dataset for temperature trend graph
      const activeChartData = CHART_DATASETS[chartMetric] || CHART_DATASETS.Hourly;

      // Format ticking live time
      const formatTime = () => {
        const d = new Date();
        return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      };

      return (
        <div className="w-full min-h-screen p-2 sm:p-3 md:p-4 lg:p-5 flex flex-col md:flex-row gap-4 lg:gap-5 transition-colors duration-300">
          
          {/* ========================================================= */}
          {/* BEGIN: LeftSidebar (FULL HEIGHT, ULTRA-RESPONSIVE)        */}
          {/* ========================================================= */}
          <aside className="w-full md:w-16 lg:w-20 bg-white dark:bg-slate-800 rounded-2xl flex md:flex-col items-center justify-between py-4 px-3 md:py-6 shadow-sm border border-slate-200/80 dark:border-slate-700 flex-shrink-0" data-purpose="icon-sidebar">
            
            {/* Top Brand Mark */}
            <div className="flex md:flex-col items-center gap-5 lg:gap-6">
              <button 
                onClick={() => { setCurrentView("dashboard"); setSelectedRegion("all"); }}
                className="w-11 h-11 rounded-2xl bg-blue-50 dark:bg-blue-950/60 text-blue-500 flex items-center justify-center hover:scale-105 transition-transform" 
                title="Storm & Disaster Early-Warning Board"
              >
                <i className="w-6 h-6 stroke-[2.2]" data-lucide="cloud-sun"></i>
              </button>
              
              {/* Navigation Menu Icons */}
              <nav className="flex md:flex-col items-center gap-2.5 lg:gap-3" data-purpose="sidebar-nav">
                {/* 1. Dashboard */}
                <button 
                  onClick={() => setCurrentView("dashboard")}
                  className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all ${
                    currentView === "dashboard"
                      ? "bg-blue-500 text-white shadow-md shadow-blue-500/25 brightness-105"
                      : "text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/60"
                  }`} 
                  title="Dashboard"
                >
                  <i className="w-5 h-5" data-lucide="layout-grid"></i>
                </button>

                {/* 2. Analytics */}
                <button 
                  onClick={() => setCurrentView("analytics")}
                  className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all ${
                    currentView === "analytics"
                      ? "bg-blue-500 text-white shadow-md shadow-blue-500/25"
                      : "text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/60"
                  }`} 
                  title="Command Center Analytics"
                >
                  <i className="w-5 h-5" data-lucide="bar-chart-2"></i>
                </button>

                {/* 3. Locations / Interactive Map */}
                <button 
                  onClick={() => setCurrentView("map")}
                  className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all ${
                    currentView === "map"
                      ? "bg-blue-500 text-white shadow-md shadow-blue-500/25"
                      : "text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/60"
                  }`} 
                  title="Regional Early-Warning Radar Map"
                >
                  <i className="w-5 h-5" data-lucide="map-pin"></i>
                </button>

                {/* 4. Live Feed List */}
                <button 
                  onClick={() => setCurrentView("liveFeed")}
                  className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all relative ${
                    currentView === "liveFeed"
                      ? "bg-blue-500 text-white shadow-md shadow-blue-500/25"
                      : "text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/60"
                  }`} 
                  title="Live Disaster Alerts Feed"
                >
                  <i className="w-5 h-5" data-lucide="list"></i>
                  {alerts.some(a => !a.isAcknowledged) && (
                    <span className="w-2 h-2 rounded-full bg-rose-500 absolute top-1.5 right-1.5 animate-pulse"></span>
                  )}
                </button>

                {/* 5. Resource Status Panel */}
                <button 
                  onClick={() => setCurrentView("resources")}
                  className={`w-10 h-10 rounded-xl flex items-center justify-center transition-all ${
                    currentView === "resources"
                      ? "bg-blue-500 text-white shadow-md shadow-blue-500/25"
                      : "text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700/60"
                  }`} 
                  title="Rescue Teams & Resource Panel (Ananya Kushwah)"
                >
                  <i className="w-5 h-5" data-lucide="shield"></i>
                </button>

                {/* 6. Academic Project Information Modal */}
                <button 
                  onClick={() => setShowProjectModal(true)}
                  className="w-10 h-10 rounded-xl text-slate-400 hover:text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/30 flex items-center justify-center transition-colors" 
                  title="Project & Team Documentation"
                >
                  <i className="w-5 h-5" data-lucide="settings"></i>
                </button>
              </nav>
            </div>

            {/* Bottom Actions: Audio & Reset Simulation */}
            <div className="mt-auto flex md:flex-col items-center gap-2.5">
              <button 
                onClick={() => setSoundEnabled(!soundEnabled)}
                className={`w-9 h-9 rounded-xl flex items-center justify-center transition-colors ${
                  soundEnabled ? "text-blue-500 bg-blue-50 dark:bg-blue-900/30" : "text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700"
                }`}
                title={soundEnabled ? "Alert Sound: On" : "Alert Sound: Muted"}
              >
                <i className="w-4 h-4" data-lucide={soundEnabled ? "volume-2" : "volume-x"}></i>
              </button>

              <button 
                onClick={() => {
                  setAlerts(INITIAL_ALERTS);
                  setBannerDismissed(false);
                  setActiveHeroTemp(27);
                  setActiveHeroCondition("Sunny Cloudy");
                  setSelectedRegion("all");
                }}
                className="w-10 h-10 rounded-xl text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/40 flex items-center justify-center transition-colors" 
                title="Reset Live Feed Simulation"
              >
                <i className="w-5 h-5" data-lucide="log-out"></i>
              </button>
            </div>
          </aside>
          {/* END: LeftSidebar */}


          {/* ========================================================= */}
          {/* BEGIN: MainContentArea (FILLS REMAINING SCREEN SPACE)     */}
          {/* ========================================================= */}
          <main className="flex-1 flex flex-col gap-4 overflow-x-hidden">
            
            {/* BEGIN: TopBar */}
            <header className="flex flex-col lg:flex-row items-stretch lg:items-center justify-between gap-4" data-purpose="topbar-header">
              
              {/* Left Title and Subtitle */}
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-xl md:text-2xl font-bold text-slate-800 dark:text-slate-100 tracking-tight">Weather Tracker</h1>
                  <span className="hidden sm:inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800 animate-pulse">
                    <span className="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
                    EARLY-WARNING LIVE
                  </span>
                </div>
                <p className="text-xs md:text-sm text-slate-400 font-medium flex items-center gap-2">
                  <span>Saturday, 1 June 2024</span>
                  <span className="w-1 h-1 rounded-full bg-slate-300 dark:bg-slate-600"></span>
                  <span className="text-blue-500 font-semibold">{formatTime()}</span>
                  {isSimulating && (
                    <span className="hidden md:inline text-[11px] text-emerald-600 dark:text-emerald-400 font-semibold">
                      • Feed Sync Active
                    </span>
                  )}
                </p>
              </div>

              {/* Center Search Capsule */}
              <div className="flex-1 max-w-xl mx-0 lg:mx-4">
                <div className="relative w-full">
                  <i className="w-4 h-4 text-blue-400 absolute left-4 top-1/2 -translate-y-1/2" data-lucide="search"></i>
                  <input 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-[#dfe8f3] dark:bg-slate-800 text-sm text-slate-700 dark:text-slate-200 placeholder-slate-400 pl-10 pr-4 py-2.5 rounded-full border border-slate-200/50 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-400/40 focus:bg-white dark:focus:bg-slate-750 transition-all shadow-inner" 
                    placeholder="Search alerts, region, storms, rescue teams..." 
                    type="text"
                  />
                  {searchQuery && (
                    <button 
                      onClick={() => setSearchQuery("")}
                      className="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-slate-600"
                    >
                      ✕
                    </button>
                  )}
                </div>
              </div>

              {/* Right Quick Action Bar */}
              <div className="flex items-center gap-3 self-end lg:self-center">
                
                {/* Day / Night Toggle Pill */}
                <div className="flex items-center bg-white dark:bg-slate-800 p-1 rounded-full border border-slate-200 dark:border-slate-700 shadow-sm">
                  <button 
                    onClick={() => setIsDarkMode(false)}
                    className={`w-7 h-7 rounded-full flex items-center justify-center transition-all ${
                      !isDarkMode ? "bg-blue-500 text-white shadow-xs" : "text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                    }`}
                    title="Light Mode"
                  >
                    <i className="w-4 h-4" data-lucide="sun"></i>
                  </button>
                  <button 
                    onClick={() => setIsDarkMode(true)}
                    className={`w-7 h-7 rounded-full flex items-center justify-center transition-all ${
                      isDarkMode ? "bg-blue-500 text-white shadow-xs" : "text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                    }`}
                    title="Command Center Dark Mode"
                  >
                    <i className="w-4 h-4" data-lucide="moon"></i>
                  </button>
                </div>

                {/* Mail Notification / Academic Info trigger */}
                <button 
                  onClick={() => setShowProjectModal(true)}
                  className="w-9 h-9 rounded-full bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:text-blue-600 border border-slate-200 dark:border-slate-700 flex items-center justify-center shadow-sm hover:shadow transition-all relative"
                  title="Team Info & Mentor Guide"
                >
                  <i className="w-4 h-4" data-lucide="mail"></i>
                  <span className="w-2 h-2 rounded-full bg-blue-500 absolute top-2 right-2 border-2 border-white dark:border-slate-800"></span>
                </button>

                {/* Bell Alert with unread indicator & dropdown toggle */}
                <div className="relative">
                  <button 
                    onClick={() => setShowNotificationTray(!showNotificationTray)}
                    className="w-9 h-9 rounded-full bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 hover:text-blue-600 border border-slate-200 dark:border-slate-700 flex items-center justify-center shadow-sm hover:shadow relative transition-all"
                    title="Live Disaster Alerts Tray"
                  >
                    <i className="w-4 h-4" data-lucide="bell"></i>
                    {alerts.filter(a => !a.isAcknowledged).length > 0 && (
                      <span className="w-2.5 h-2.5 rounded-full bg-red-500 absolute top-1.5 right-1.5 border-2 border-white dark:border-slate-800 animate-pulse"></span>
                    )}
                  </button>

                  {/* Dropdown Notification Tray */}
                  {showNotificationTray && (
                    <div className="absolute right-0 top-12 w-80 sm:w-96 bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-200 dark:border-slate-700 p-4 z-50">
                      <div className="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-700 mb-3">
                        <div className="flex items-center gap-2">

                          <span className="px-2 py-0.5 rounded-full bg-red-100 dark:bg-red-950 text-red-600 text-[10px] font-bold">

                        <button

                      </div>

                      <div className="max-h-72 overflow-y-auto space-y-2 pr-1">
                        {alerts.slice(0, 5).map(alert => (

                                ? 'bg-amber-50/70 dark:bg-amber-950/30 border-amber-200 dark:border-amber-900/50'

                          >

                                {alert.severity}
                              </span>
                            </div>
